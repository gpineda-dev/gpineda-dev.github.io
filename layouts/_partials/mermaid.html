<style>
  .mermaid {
    text-align: center;
    margin: 2rem 0;
    overflow-x: auto;
    background: transparent;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
    display: inline-block;
  }
</style>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  function isDarkMode() {
    const htmlTheme = document.documentElement.dataset.theme;
    if (htmlTheme === 'dark') return true;
    if (htmlTheme === 'light') return false;
    if (document.body && document.body.classList.contains('dark')) return true;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function getMermaidConfig(isDark) {
    return {
      startOnLoad: false,
      theme: isDark ? 'dark' : 'default',
      securityLevel: 'loose',
      fontFamily: 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif',
      themeVariables: isDark ? {
        darkMode: true,
        background: 'transparent',
        primaryColor: '#1e293b',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#64748b',
        lineColor: '#94a3b8',
        secondaryColor: '#0f172a',
        tertiaryColor: '#1e293b',
        nodeBorder: '#64748b',
        clusterBkg: '#0f172a',
        clusterBorder: '#475569',
        defaultLinkColor: '#94a3b8',
        titleColor: '#f8fafc',
        edgeLabelBackground: '#1e293b',
        actorBorder: '#64748b',
        actorBkg: '#1e293b',
        actorTextColor: '#f8fafc',
        actorLineColor: '#94a3b8',
        signalColor: '#f8fafc',
        signalTextColor: '#f8fafc',
        labelBoxBkgColor: '#1e293b',
        labelBoxBorderColor: '#64748b',
        labelTextColor: '#f8fafc',
        loopTextColor: '#f8fafc',
        noteBorderColor: '#64748b',
        noteBkgColor: '#1e293b',
        noteTextColor: '#f8fafc'
      } : {
        background: 'transparent',
        primaryColor: '#f8fafc',
        primaryTextColor: '#0f172a',
        primaryBorderColor: '#94a3b8',
        lineColor: '#475569',
        secondaryColor: '#f1f5f9',
        tertiaryColor: '#e2e8f0',
        nodeBorder: '#94a3b8',
        clusterBkg: '#f8fafc',
        clusterBorder: '#cbd5e1',
        defaultLinkColor: '#475569',
        titleColor: '#0f172a',
        edgeLabelBackground: '#f8fafc'
      }
    };
  }

  let isRendering = false;
  let renderQueued = false;

  async function renderAllMermaid() {
    if (isRendering) {
      renderQueued = true;
      return;
    }
    isRendering = true;

    const elements = Array.from(document.querySelectorAll('.mermaid'));
    elements.forEach((el) => {
      if (!el.dataset.mermaidSrc) {
        el.dataset.mermaidSrc = el.textContent.trim();
      }
    });

    const isDark = isDarkMode();
    mermaid.initialize(getMermaidConfig(isDark));

    for (let i = 0; i < elements.length; i++) {
      const el = elements[i];
      const src = el.dataset.mermaidSrc;
      if (!src) continue;

      const id = `mermaid-${i}-${Date.now()}`;
      try {
        const { svg } = await mermaid.render(id, src);
        el.innerHTML = svg;
      } catch (err) {
        console.error("Mermaid rendering error on element", i, err);
      }
    }

    isRendering = false;
    if (renderQueued) {
      renderQueued = false;
      renderAllMermaid();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderAllMermaid);
  } else {
    renderAllMermaid();
  }

  // Reactive theme observer (PaperMod data-theme on html or class on body)
  const observer = new MutationObserver(() => {
    renderAllMermaid();
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.body) {
    observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
  }

  // System theme preference listener
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      renderAllMermaid();
    });
  }
</script>
